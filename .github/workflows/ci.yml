name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-amd64:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Rust solver
        run: cargo test --manifest-path eqwgpu1445/Cargo.toml --release --locked

      - name: Build and test Linux amd64
        if: runner.os == 'Linux'
        run: |
          ./build-wgpu.sh
          go test -tags wgpu ./...

      - name: Build and test Windows amd64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build-wgpu.ps1
          $env:Path = "$pwd;$env:Path"
          go test -tags wgpu ./...
